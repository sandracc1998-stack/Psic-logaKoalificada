<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psikoala - En mantenimiento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #FDF8F5; /* El fondo crema suave de tu paleta */
            color: #4A2E35; /* Tu color granate corporativo */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .contenedor-mantenimiento {
            max-width: 500px;
            padding: 40px 30px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(74, 46, 53, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .icono-koala {
            width: 100px;
            height: auto;
            margin-bottom: 10px;
            opacity: 0.85;
        }
        h1 {
            font-family: Georgia, serif;
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.3;
        }
        p {
            color: #666666;
            font-size: 1.1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="contenedor-mantenimiento">
        <!-- Reutilizamos el logotipo del koala que tienes subido en tu carpeta -->
        <img src="img/psicokoala.png" alt="Psikoala Logo" class="icono-koala">
        
        <h1>Trabajando para mejorar la web</h1>
        
        <p>Estamos haciendo unos pequeños ajustes en el diseño para ofrecerte una mejor experiencia. ¡Volvemos muy pronto!</p>
    </div>

</body>
</html>
