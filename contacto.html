            <!-- Botones del menú con fondo rosa, bordes redondeados y tipografía Georgia -->

            <li><a href="filosofia.html" style="background-color: #F7E1E5; color: #6d4b53; font-family: Georgia, serif; padding: 8px 16px; border-radius: 20px; text-decoration: none; display: inline-block; font-weight: 600; font-size: 0.95rem;">Filosofía koala</a></li>

        </ul>

<!-- CUERPO PRINCIPAL DE LA PÁGINA -->
<!-- Se añade el margen superior de 130px para limpiar el menú fijo superior -->
<main class="contacto-contenedor-pagina" style="max-width: 1200px; margin: 0 auto; padding: 130px 20px 60px 20px;">
  
  <!-- CONTENEDOR PRINCIPAL EN DOS COLUMNAS -->
  <div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start;">
    
    <!-- COLUMNA IZQUIERDA: TÍTULO, SUBTÍTULO Y FORMULARIO -->
    <div style="flex: 1; min-width: 320px;">
        <!-- CONTENEDOR PRINCIPAL EN DOS COLUMNAS -->
<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; margin-bottom: 40px; width: 100%;">
    
    <!-- COLUMNA IZQUIERDA: TÍTULO Y TARJETA CON EL SUBTÍTULO -->
    <div style="flex: 1; min-width: 320px;">
        
        <!-- TÍTULO GRANDE MODIFICADO -->
        <h1 style="color: #6d4b53; font-family: Georgia, 'Times New Roman', serif; font-size: 3.4rem; font-weight: 700; margin: 0 0 30px 0; line-height: 1.25; text-transform: lowercase;">
            <span style="text-transform: capitalize;">Contáctame</span>
        </h1>
        
        <!-- TARJETA ROSA OSCURO CON EL SUBTÍTULO -->
        <div class="tarjeta-subtitulo-oscura" style="background-color: #6d4b53; padding: 25px 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(109, 75, 83, 0.15); margin-bottom: 40px;">
            <p style="font-size: 1.25rem; line-height: 1.5; color: #ffffff; margin: 0; opacity: 0.95; font-family: Georgia, serif;">
                Cuéntame qué necesitas y nos pondremos en marcha juntos.
            </p>
        </div>
        
    </div>
    
    <!-- COLUMNA DERECHA: IMAGEN DE CONTACTO AÑADIDA -->
    <div style="flex: 0 0 350px; min-width: 300px; margin: 0 auto;">
        <img src="img/contacto.png" alt="Contacto" style="width: 100%; height: auto; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    </div>
    
</div>

     
        <!-- FORMULARIO DE CONTACTO -->
        <form action="https://formspree.io/f/mnjkykly" method="POST" class="formulario-cuerpo" style="display: flex; flex-direction: column; gap: 25px;">
            
            <div class="formulario-fila-doble" style="display: flex; flex-wrap: wrap; gap: 25px;">
                <!-- Nombre Completo -->
                <div class="formulario-grupo" style="flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 8px;">
                    <label for="id-nombre" style="font-size: 1.15rem; font-weight: 600; color: #6d4b53; font-family: sans-serif;">Nombre completo</label>
                    <input type="text" id="id-nombre" name="nombre" required style="font-size: 1.15rem; padding: 14px; border: 2px solid #6d4b53; border-radius: 12px; width: 100%; box-sizing: border-box; background-color: #FFFFFF; box-shadow: inset 0 2px 4px rgba(109, 75, 83, 0.06); outline: none;">
                </div>
                <!-- Correo Electrónico -->
                <div class="formulario-grupo" style="flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 8px;">
                    <label for="id-email" style="font-size: 1.15rem; font-weight: 600; color: #6d4b53; font-family: sans-serif;">Correo electrónico</label>
                    <input type="email" id="id-email" name="email" required style="font-size: 1.15rem; padding: 14px; border: 2px solid #6d4b53; border-radius: 12px; width: 100%; box-sizing: border-box; background-color: #FFFFFF; box-shadow: inset 0 2px 4px rgba(109, 75, 83, 0.06); outline: none;">
                </div>
            </div>

            <!-- ¿En qué puedo ayudarte? -->
            <div class="formulario-grupo ancho-completo" style="display: flex; flex-direction: column; gap: 8px; width: 100%;">
                <label for="id-asunto" style="font-size: 1.15rem; font-weight: 600; color: #6d4b53; font-family: sans-serif;">¿En qué puedo ayudarte?</label>
                <textarea id="id-asunto" name="asunto" required rows="5" style="font-size: 1.15rem; padding: 14px; border: 2px solid #6d4b53; border-radius: 12px; width: 100%; box-sizing: border-box; background-color: #FFFFFF; box-shadow: inset 0 2px 4px rgba(109, 75, 83, 0.06); font-family: inherit; resize: vertical; outline: none;"></textarea>
            </div>

            <!-- Botón de Envío -->
            <div class="formulario-boton-contenedor" style="text-align: left; margin-top: 15px;">
                <button type="submit" style="color: #ffffff !important; background-color: #6d4b53; font-size: 1.2rem; font-weight: 700; padding: 14px 45px; border: none; border-radius: 50px; cursor: pointer; transition: transform 0.2s ease, background-color 0.3s ease; box-shadow: 0 4px 15px rgba(109, 75, 83, 0.2);">
                    Enviar mensaje
                </button>
            </div>

        </form>
        
    </div>
    
    <!-- COLUMNA DERECHA: IMAGEN MEDIANA -->
    <div style="flex: 0 0 350px; min-width: 300px; margin: 0 auto;">
        <img src="img/contacto.png" alt="Contacto" style="width: 100%; height: auto; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    </div>
    
  </div>
</main>


<!-- PIE DE PÁGINA FINAL -->
<footer class="pie-contacto-final">
    <div class="pie-contenedor">
        <ul class="contacto-final-lista">
            <li><a href="mailto:psikoala@psikoala.com">✉ psikoala@psikoala.com</a></li>

          <a href="https://www.instagram.com/psico.koalificada" target="_blank" rel="noopener noreferrer">
  📸 @psico.koalificada
</a>
        </ul>
    </div> 
</footer>
