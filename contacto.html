<!-- CUERPO PRINCIPAL DE LA PÁGINA (CONTACTO) -->
<main class="contacto-contenedor-pagina" style="max-width: 900px !important; margin: 0 auto !important; padding: 130px 20px 60px 20px !important; box-sizing: border-box !important; display: block !important;">
  
  <div style="display: flex !important; flex-direction: column !important; gap: 20px !important; width: 100% !important; box-sizing: border-box !important; margin-bottom: 30px !important;">
    
    <!-- 1. TÍTULO GRANDE -->
    <h1 style="color: #6d4b53 !important; font-family: Georgia, 'Times New Roman', serif !important; font-size: 3.4rem !important; font-weight: 700 !important; margin: 0 !important; line-height: 1.25 !important; text-transform: lowercase !important; text-align: center !important;">
        <span style="text-transform: capitalize !important;">Contáctame</span>
    </h1>
    
    <!-- 2. IMAGEN DEBAJO DEL TÍTULO Y ENCIMA DE LA TARJETA -->
    <div style="max-width: 280px !important; margin: 0 auto !important; width: 100% !important; display: flex !important; justify-content: center !important; box-sizing: border-box !important;">
        <img src="img/contacto.png.png" alt="Contacto" style="width: 100% !important; height: auto !important; border-radius: 20px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.05) !important;">
    </div>

    <!-- 3. TARJETA ROSA OSCURO CON EL SUBTÍTULO -->
    <div class="tarjeta-subtitulo-oscura" style="background-color: #6d4b53 !important; padding: 25px 30px !important; border-radius: 15px !important; box-shadow: 0 4px 15px rgba(109, 75, 83, 0.15) !important; width: 100% !important; box-sizing: border-box !important;">
        <p style="font-size: 1.25rem !important; line-height: 1.5 !important; color: #ffffff !important; margin: 0 !important; opacity: 0.95 !important; font-family: Georgia, serif !important; text-align: center !important;">
            Cuéntame qué necesitas y nos pondremos en marcha juntos.
        </p>
    </div>
    
  </div>


<!-- Inicio del Formulario de Contacto -->
<form action="https://formspree.io" method="POST" style="max-width: 450px; margin: 30px auto; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; padding: 25px; border: 1px solid #e2e8f0; border-radius: 12px; background-color: #ffffff; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);">
  
  <!-- Campo: Nombre -->
  <div style="margin-bottom: 18px;">
    <label for="nombre" style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c; font-size: 14px;">Nombre</label>
    <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo" style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; color: #334155;">
  </div>

  <!-- Campo: Correo electrónico -->
  <div style="margin-bottom: 18px;">
    <label for="email" style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c; font-size: 14px;">Correo electrónico</label>
    <input type="email" id="email" name="email" required placeholder="tu@email.com" style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; color: #334155;">
  </div>

  <!-- Campo: Qué necesitas -->
  <div style="margin-bottom: 22px;">
    <label for="mensaje" style="display: block; margin-bottom: 6px; font-weight: 600; color: #1a202c; font-size: 14px;">¿Qué necesitas?</label>
    <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Cuéntame detalladamente en qué puedo ayudarte..." style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 15px; color: #334155; resize: vertical; min-height: 100px;"></textarea>
  </div>

  <!-- Botón de enviar -->
  <button type="submit" style="width: 100%; padding: 12px; background-color: #2563eb; color: #ffffff; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background-color 0.2s ease;">Enviar mensaje</button>

</form>
<!-- Fin del Formulario de Contacto -->

</div>


<!-- BLOQUE DE SEPARACIÓN Y LIMPIEZA ANTES DEL PIE DE PÁGINA -->
<div style="clear: both !important; display: block !important; width: 100% !important; height: 1px !important; margin-top: 60px !important;"></div>

<!-- PIE DE PÁGINA FINAL -->
<footer class="pie-contacto-final">
    <div class="pie-contenedor">
        <ul class="contacto-final-lista">
            <li><a href="mailto:psikoala@psikoala.com">✉ psikoala@psikoala.com</a></li>
            <li><span>📍 Santiago de Compostela</span></li>
          <a href="https://www.instagram.com/psico.koalificada" target="_blank" rel="noopener noreferrer">
  📸 @psico.koalificada
</a>
        </ul>
    </div> 
</footer>
