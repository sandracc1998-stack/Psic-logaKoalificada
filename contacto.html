            <!-- Botones del menú con fondo rosa, bordes redondeados y tipografía Georgia -->
            <li><a href="index.html" style="background-color: #F7E1E5; color: #6d4b53; font-family: Georgia, serif; padding: 8px 16px; border-radius: 20px; text-decoration: none; display: inline-block; font-weight: 600; font-size: 0.95rem;">Inicio</a></li>
            <li><a href="filosofia.html" style="background-color: #F7E1E5; color: #6d4b53; font-family: Georgia, serif; padding: 8px 16px; border-radius: 20px; text-decoration: none; display: inline-block; font-weight: 600; font-size: 0.95rem;">Filosofía koala</a></li>

        </ul>

<!-- CUERPO PRINCIPAL DE LA PÁGINA (CONTACTO) -->
<!-- Se reduce el max-width a 900px para estrechar todo el diseño del formulario en la pantalla -->
<main class="contacto-contenedor-pagina" style="max-width: 900px !important; margin: 0 auto !important; padding: 130px 20px 60px 20px !important; box-sizing: border-box !important; display: block !important;">
  
  <!-- CONTENEDOR SUPERIOR EN DOS COLUMNAS (Título y Tarjeta a la izquierda, Imagen a la derecha) -->
  <div style="display: flex !important; flex-wrap: wrap !important; gap: 40px !important; align-items: flex-start !important; width: 100% !important; box-sizing: border-box !important; margin-bottom: 30px !important;">
    
    <!-- COLUMNA IZQUIERDA: CONTIENE EL TÍTULO Y LA TARJETA DEL SUBTÍTULO -->
    <div style="flex: 1 !important; min-width: 320px !important; display: flex !important; flex-direction: column !important; gap: 20px !important; box-sizing: border-box !important;">
        
        <!-- TÍTULO GRANDE UNIFICADO -->
        <h1 style="color: #6d4b53 !important; font-family: Georgia, 'Times New Roman', serif !important; font-size: 3.4rem !important; font-weight: 700 !important; margin: 0 !important; line-height: 1.25 !important; text-transform: lowercase !important;">
            <span style="text-transform: capitalize !important;">Contáctame</span>
        </h1>
        
        <!-- TARJETA ROSA OSCURO CON EL SUBTÍTULO -->
        <div class="tarjeta-subtitulo-oscura" style="background-color: #6d4b53 !important; padding: 25px 30px !important; border-radius: 15px !important; box-shadow: 0 4px 15px rgba(109, 75, 83, 0.15) !important; width: 100% !important; box-sizing: border-box !important;">
            <p style="font-size: 1.25rem !important; line-height: 1.5 !important; color: #ffffff !important; margin: 0 !important; opacity: 0.95 !important; font-family: Georgia, serif !important;">
                Cuéntame qué necesitas y nos pondremos en marcha juntos.
            </p>
        </div>
        
    </div>
    
    <!-- COLUMNA DERECHA: IMAGEN REDUCIDA A 280PX Y UBICADA A LA DERECHA DE LA TARJETA -->
    <div style="flex: 0 0 280px !important; min-width: 250px !important; margin: 0 auto !important; display: flex !important; align-items: center !important; box-sizing: border-box !important;">
        <img src="img/contacto.png.png" alt="Contacto" style="width: 100% !important; height: auto !important; border-radius: 20px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.05) !important;">
    </div>
    
  </div>

  <!-- CONTENEDOR INFERIOR PARA EL FORMULARIO (Ocupa todo el ancho por debajo) -->
  <div style="width: 100% !important; box-sizing: border-box !important;">
        <!-- FORMULARIO DE CONTACTO -->
        <form action="https://formspree.io" method="POST" class="formulario-cuerpo" style="display: flex !important; flex-direction: column !important; gap: 25px !important; width: 100% !important; box-sizing: border-box !important;">
            
            <div class="formulario-fila-doble" style="display: flex !important; flex-wrap: wrap !important; gap: 25px !important; width: 100% !important;">
                <!-- Nombre Completo -->
                <div class="formulario-grupo" style="flex: 1 !important; min-width: 280px !important; display: flex !important; flex-direction: column !important; gap: 8px !important;">
                    <label for="id-nombre" style="font-size: 1.15rem !important; font-weight: 600 !important; color: #6d4b53 !important; font-family: sans-serif !important;">Nombre completo</label>
                    <input type="text" id="id-nombre" name="nombre" required style="font-size: 1.15rem !important; padding: 14px !important; border: 2px solid #6d4b53 !important; border-radius: 12px !important; width: 100% !important; box-sizing: border-box !important; background-color: #FFFFFF !important; box-shadow: inset 0 2px 4px rgba(109, 75, 83, 0.06) !important; outline: none !important;">
                </div>
                <!-- Correo Electrónico -->
                <div class="formulario-grupo" style="flex: 1 !important; min-width: 280px !important; display: flex !important; flex-direction: column !important; gap: 8px !important;">
                    <label for="id-email" style="font-size: 1.15rem !important; font-weight: 600 !important; color: #6d4b53 !important; font-family: sans-serif !important;">Correo electrónico</label>
                    <input type="email" id="id-email" name="email" required style="font-size: 1.15rem !important; padding: 14px !important; border: 2px solid #6d4b53 !important; border-radius: 12px !important; width: 100% !important; box-sizing: border-box !important; background-color: #FFFFFF !important; box-shadow: inset 0 2px 4px rgba(109, 75, 83, 0.06) !important; outline: none !important;">
                </div>
            </div>

            <!-- ¿En qué puedo ayudarte? -->
            <div class="formulario-grupo ancho-completo" style="display: flex !important; flex-direction: column !important; gap: 8px !important; width: 100% !important;">
                <label for="id-asunto" style="font-size: 1.15rem !important; font-weight: 600 !important; color: #6d4b53 !important; font-family: sans-serif !important;">¿En qué puedo ayudarte?</label>
                <textarea id="id-asunto" name="asunto" required rows="5" style="font-size: 1.15rem !important; padding: 14px !important; border: 2px solid #6d4b53 !important; border-radius: 12px !important; width: 100% !important; box-sizing: border-box !important; background-color: #FFFFFF !important; box-shadow: inset 0 2px 4px rgba(109, 75, 83, 0.06) !important; font-family: inherit !important; resize: vertical !important; outline: none !important;"></textarea>
            </div>

            <!-- Botón de Envío -->
            <div class="formulario-boton-contenedor" style="text-align: left !important; margin-top: 15px !important; width: 100% !important;">
                <button type="submit" style="color: #ffffff !important; background-color: #6d4b53 !important; font-size: 1.2rem !important; font-weight: 700 !important; padding: 14px 45px !important; border: none !important; border-radius: 50px !important; cursor: pointer !important; transition: transform 0.2s ease, background-color 0.3s ease !important; box-shadow: 0 4px 15px rgba(109, 75, 83, 0.2) !important;">
                    Enviar mensaje
                </button>
            </div>

        </form>
  </div>
</main>


<!-- PIE DE PÁGINA FINAL -->
<footer class="pie-contacto-final">
    <div class="pie-contenedor">
        <ul class="contacto-final-lista">
            <li><a href="mailto:psikoala@psikoala.com">✉ psikoala@psikoala.com</a></li>
            <li><span>📍 Santiago de Compostela</span></li>
          <a href="https://www.instagram.com/psico.koalificada" target="_blank" rel="noopener noreferrer">
  📸 @psico.koalificada
</a>
        </ul>
    </div> 
</footer>
</body>
</html>
